<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#120c10">
  <title>NONO Stage Actor</title>
  <link rel="manifest" href="manifest.webmanifest?v=343fe50">
  <link rel="apple-touch-icon" href="icons/icon-1024.png?v=343fe50">
  <link rel="icon" href="icons/icon-192.png?v=343fe50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stage Actor">
  <meta name="stage-version" content="343fe50">
  <link rel="stylesheet" href="css/stage.css?v=343fe50">
</head>
<body>
  <div id="app">
    <section id="title" class="screen">
      <h1 class="logo"><img src="img/title-logo.png?v=343fe50" alt="NONO Stage Actor" width="520" height="484"></h1>
      <p class="sub">演目を選んでください</p>
      <ul id="work-list"></ul>
    </section>

    <section id="stage" class="screen" hidden>
      <div id="world">
        <img id="bg" alt="">
        <div id="actors"></div>
      </div>
      <div id="textlayer">
        <div id="bubble" class="bubble" hidden><div class="name"></div><div class="text"></div></div>
        <div id="window" class="window" hidden><div class="name"></div><div class="text"></div></div>
      </div>
      <div id="choices" hidden><p class="prompt"></p><div class="options"></div></div>
      <div id="curtain">
        <div class="art"><div class="panel l"></div><div class="panel r"></div><img class="frame" src="theater/frame.png?v=343fe50" alt=""></div>
        <div class="playbill"></div>
      </div>
      <button id="to-title" type="button" aria-label="タイトルへ戻る">×</button>
    </section>

    <div id="error" hidden></div>
  </div>
  <script type="module" src="js/main.js?v=343fe50"></script>
</body>
</html>
